name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Show Java
        run: java -version && echo "JAVA_HOME=$JAVA_HOME"

      - name: Compile all modules
        run: ./gradlew compileKotlin --no-daemon --stacktrace --no-configuration-cache

      - name: Unit tests
        run: >
          ./gradlew
          :platform:core:test
          :platform:editor:test
          :ide-app:test
          --no-daemon
          --stacktrace
          --no-configuration-cache

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7
